name: Build and Deploy Node App to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Disable strict integrity check
        run: npm config set strict-ssl false

     
      - name: Force public npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Clean npm cache
        run: npm cache clean --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Verify Multer installation 
        run: npm ls multer

      - name: Verify Multer folder exists 
        run: ls -R node_modules/multer

      - name: Test Multer require 
        run: node -e "require('multer'); console.log('Multer OK')"
        
      - name: Build (if applicable)
        run: npm run build --if-present

      - name: Zip artifact
        run: zip -r release.zip .  -x "node_modules/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "wappmta"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
